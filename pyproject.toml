[project]
name = "kompass"
version = "2.0.1"
description = "Administration platform for local sections of the Young German Alpine Club"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtpd",
    "auditlog3",
    "bcrypt",
    "celery",
    "coverage",
    "django==5.1.15",
    "django-celery-beat",
    "django-celery-email",
    "django-cors-headers>=4.9.0",
    "django-jet-reboot",
    "django-markdownify",
    "django-markdownx",
    "django-nested-admin",
    "django-ninja>=1.6.2",
    "django-oauth-toolkit",
    "django-split-settings",
    "mozilla-django-oidc",
    "openpyxl",
    "pymemcache",
    "pypdf",
    "redis",
    "rules",
    "schwifty",
    "sphinx",
    "sphinxawesome-theme",
    "tomli",
    "xlsxwriter",
]

# Everything above installs from a wheel. These two do not: both are C extensions that PyPI
# ships as source only, so installing them needs a compiler and, for mysqlclient, the MySQL
# client headers. That is fine in the Docker images, which are built on python:3.13-trixie and
# ask for both extras -- and it is the reason a plain `uv sync` could not work anywhere else,
# including the container an agent runs in.
#
# Neither is needed to run the tests: those use SQLite and Django's own test server. Keeping
# them out of the default dependency set is what makes `uv run manage.py test` possible without
# Docker, a compiler, or a database server.
# Tools the project is developed and validated with, rather than run with. `uv sync` installs
# this group by default and `uv export --no-dev` leaves it out, which is why the Docker images
# pass that flag: none of this belongs in a deployed image.
[dependency-groups]
dev = [
    # Writes the `.mo` catalogues where gettext's `msgfmt` is not installed — see
    # .agent/compile-messages.py.
    "polib",
]

[project.optional-dependencies]
# The MySQL/MariaDB driver, for every deployment that talks to one.
mysql = ["mysqlclient"]
# The application server, for an image that serves rather than tests.
server = ["uwsgi"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = false
order-by-type = false
detect-same-package = false
