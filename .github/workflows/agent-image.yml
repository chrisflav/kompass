name: Agent image

# Builds docker/agent/Dockerfile — the image an orchestra agent's task pod runs in for this
# repository — and publishes it as ghcr.io/<owner>/kompass-agent.
#
# Separate from the build-and-test workflows because it has nothing to do with a change under
# test: it is a toolbox (texlive, pandoc, gettext, a compiler) over orchestra's agent image, and
# the only things that change it are its own Dockerfile and a bump of the base image it derives
# from. Building it on every push would be minutes of texlive for nothing.
#
# `.agent/config.json` names `:latest`, and Kubernetes pulls a `:latest` reference every time, so
# a push to main is the deploy — no revision to bump anywhere else.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/agent/Dockerfile'
      - '.github/workflows/agent-image.yml'
  pull_request:
    paths:
      - 'docker/agent/Dockerfile'
      - '.github/workflows/agent-image.yml'
  # For a base-image bump that lands without touching the Dockerfile, and for rebuilding against
  # current apt packages.
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # texlive is most of the build and most of the layer; the default limit is far more rope than
    # it needs, and a hung build should fail rather than sit there.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Skipped for pull requests, which do not push: a fork PR gets a read-only token anyway, so
      # logging in would fail rather than degrade.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=ref,event=pr
            # Bare commit sha, so a tag is exactly what `git rev-parse HEAD` prints — for pinning
            # a specific build when `:latest` is not wanted.
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Task pods pick this up on their next start: \`.agent/config.json\` names"
            echo "\`:latest\`, which Kubernetes re-pulls every time."
          } >> "$GITHUB_STEP_SUMMARY"
