name: Check frontend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest

    # This job runs fork-authored code (`npm ci`, the test suite, the build)
    # and needs nothing but the checkout, so it never inherits a write token —
    # whatever the repository default is set to.
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same major as the SPA image builds with (docker/production/spa/Dockerfile).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `vite build` strips the types instead of checking them, so the build
      # alone would let a type error through.
      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
