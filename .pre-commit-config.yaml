repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.11
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Reorder imports
      - id: ruff-check
        args: [ --fix, --select, I ]
      # Run the formatter.
      - id: ruff-format
  # `mypy --strict` over the finance rules API, the engine and the reference
  # ruleset. The scope is `files` in pyproject.toml, which is why this hook
  # passes no filenames: a section's rules are type-checked against
  # `kompass.rules`, so that module has to be checked here too. Nothing outside
  # that scope is checked — see the comment on [tool.mypy].
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (finance rules API and engine)
        pass_filenames: false
