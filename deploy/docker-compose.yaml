x-kompass:
    &kompass
    image: ghcr.io/chrisflav/kompass:latest
    environment:
      - DJANGO_SETTINGS_MODULE=jdav_web.settings
      - KOMPASS_CONFIG_DIR_PATH=/app/config/
    restart: always
    depends_on:
      - redis
      - cache

services:
    master:
        <<: *kompass
        entrypoint: /app/docker/production/entrypoint-master.sh
        volumes:
          - uwsgi_data:/tmp/uwsgi/
          - web_static:/app/static/
          - web_static:/var/www/jdav_web/static/
          - ./media:/var/www/jdav_web/media/
          - ./config:/app/config:ro
        networks:
          - main
        extra_hosts:
          - "host:10.26.42.1"

    nginx:
        image: ghcr.io/chrisflav/kompass-nginx:latest
        restart: always
        volumes:
          - uwsgi_data:/tmp/uwsgi/
          - web_static:/var/www/jdav_web/static/:ro
          - ./media:/var/www/jdav_web/media/:ro
        ports:
          - "3000:80"
        depends_on:
          - master
        networks:
          - main

    # The pilot frontend's own application server. Separate from `master` so its
    # worker pool cannot queue in front of the requests real users are making.
    spa_master:
        <<: *kompass
        entrypoint: /app/docker/production/entrypoint-spa-master.sh
        volumes:
          - uwsgi_spa_data:/tmp/uwsgi-spa/
          # Read-only, like the celery worker: it renders PDFs that embed the
          # logo by absolute static path, but never runs collectstatic itself.
          - web_static:/var/www/jdav_web/static/:ro
          - ./media:/var/www/jdav_web/media/
          - ./config:/app/config:ro
        depends_on:
          - master
        networks:
          - main
        extra_hosts:
          - "host:10.26.42.1"

    # The new frontend, on its own port so a second domain can be pointed at it
    # while nginx above keeps serving the Django site unchanged. Bound to
    # localhost: the TLS proxy is the only thing that should reach it, and the
    # port otherwise offers the API in cleartext to anything on the network.
    spa:
        image: ghcr.io/chrisflav/kompass-spa:latest
        restart: always
        volumes:
          - uwsgi_spa_data:/tmp/uwsgi-spa/
          - web_static:/var/www/jdav_web/static/:ro
          - ./media:/var/www/jdav_web/media/:ro
        ports:
          - "127.0.0.1:3001:80"
        depends_on:
          - spa_master
        networks:
          - main

    cache:
        restart: always
        image: memcached:alpine
        networks:
          - main

    redis:
        restart: always
        image: redis:6-alpine
        networks:
          - main

    celery_worker:
        <<: *kompass
        entrypoint: /app/docker/production/entrypoint-celery-worker.sh
        volumes:
          # pdflatex embeds the logo by absolute settings.static_root path, so the
          # worker needs the collected static files to render a PDF at all
          - web_static:/var/www/jdav_web/static/:ro
          # the worker renders PDFs into the media directory and attaches them to mails
          - ./media:/var/www/jdav_web/media/
          - ./config:/app/config:ro
        networks:
          - main
        extra_hosts:
          - "host:10.26.42.1"

    # Receives incoming mail from the MTA over LMTP and forwards it to the
    # targets configured in kompass. The MTA reaches this on port 8024; when it
    # runs in another compose project, attach that project's network here.
    lmtp:
        <<: *kompass
        entrypoint: /app/docker/production/entrypoint-lmtp.sh
        volumes:
          - ./config:/app/config:ro
        ports:
          - "127.0.0.1:8024:8024"
        networks:
          - main

    celery_beat:
        <<: *kompass
        entrypoint: /app/docker/production/entrypoint-celery-beat.sh
        volumes:
          - ./config:/app/config:ro
        networks:
          - main
        extra_hosts:
          - "host:10.26.42.1"

volumes:
  uwsgi_data:
  uwsgi_spa_data:
  web_static:

networks:
  main:
    driver: bridge
    ipam:
      config:
        - subnet: 10.26.42.0/24
          gateway: 10.26.42.1
