# uwsgi for the pilot frontend's domain.
#
# A separate socket and a separate worker pool from kompass.uwsgi.ini on
# purpose: the pilot and the live site would otherwise share two blocking
# workers, and a handful of parallel API calls from one visitor here could
# queue in front of real users and end with them seeing the downtime page.

[uwsgi]

socket = /tmp/uwsgi-spa/kompass.sock
chdir = /app/jdav_web/
module = jdav_web.wsgi
master = true
# The frontend opens five or six API calls per page, and they must not
# serialize. Threads alone do not get there: they share one interpreter lock,
# so two processes ran at most two requests' Python at a time and the rest
# queued behind them (1 s for a call whose median is under 200 ms). One process
# per core of the production host (4), each with threads for the time a request
# spends waiting on the database or pdflatex.
#
# Memory: a worker sits at ~190-240 MB RSS there, so two more cost ~0.5 GB of
# the ~1.5 GB the host has free, and it has no swap. reload-on-rss recycles a
# worker that grows past 300 MB, which caps the pool at ~1.2 GB instead of
# letting it eat the rest (and the OOM killer pick the database server).
#
# Database connections: Django keeps one per thread (see CONN_MAX_AGE), so
# this pool holds up to 16, well inside MariaDB's default max_connections (151).
processes = 4
threads = 4
reload-on-rss = 300
# Shed load here rather than let it pile up: the pilot is the side that should
# feel it, and the listen queue is what turns slow into an outage.
listen = 64
harakiri = 30
chmod-socket = 666
vacuum = true
