# uwsgi for the pilot frontend's domain.
#
# A separate socket and a separate worker pool from kompass.uwsgi.ini on
# purpose: the pilot and the live site would otherwise share two blocking
# workers, and a handful of parallel API calls from one visitor here could
# queue in front of real users and end with them seeing the downtime page.

[uwsgi]

socket = /tmp/uwsgi-spa/kompass.sock
chdir = /app/jdav_web/
module = jdav_web.wsgi
master = true
processes = 2
# The frontend opens several API calls per page, and they must not serialize.
threads = 4
# Shed load here rather than let it pile up: the pilot is the side that should
# feel it, and the listen queue is what turns slow into an outage.
listen = 64
harakiri = 30
chmod-socket = 666
vacuum = true
