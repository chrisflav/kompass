# Serves the Kompass SPA on its own domain, with the backend proxied in on the
# same origin. Same origin is the point: the API, the OAuth provider and the
# uploaded files are all reachable as relative paths, so there is no CORS to
# configure and no cross-site cookie to get wrong.
#
# The Django site keeps its own vhost (see ../nginx/kompass.nginx.conf) and is
# unaffected by anything here.

# The pilot's own uwsgi, not the one serving the existing site. Sharing that
# socket would let a single visitor here queue requests against the two workers
# real users depend on, and a full backlog would show them the downtime page.
upstream uwsgi {
    server unix:/tmp/uwsgi-spa/kompass.sock;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    error_page 502 /downtime/502.html;

    root /var/www/kompass_spa;
    index index.html;

    # --- backend, proxied onto this origin -------------------------------

    # One regex covers every path Django owns on this domain:
    #   /api/       the REST API
    #   /o/         the OAuth2 provider — /o/authorize/ starts the login,
    #               /o/token/ is where the SPA redeems its code
    #   /accounts/  the sign-in form /o/authorize/ redirects an anonymous
    #               visitor to (or /oidc/ where OIDC is configured)
    #   /media/     uploaded files, permission-checked by Django
    #
    # The optional two-letter prefix matches Django's own locale redirects:
    # `/media/x.pdf` is answered with `/de/media/x.pdf`, and without this the
    # redirect would fall through to the SPA and render the router instead.
    # Quoted: nginx's own parser reads an unquoted `{2}` as the start of a
    # config block and refuses to load.
    # `(/|$)` so a bare `/api` or `/media` reaches Django (and its APPEND_SLASH
    # redirect) instead of falling through and answering 200 with the app shell.
    location ~ "^(/[a-z]{2})?/(api|o|accounts|oidc|media)(/|$)" {
        uwsgi_pass uwsgi;
        include /etc/nginx/uwsgi_params;
    }

    # The OAuth2 provider lives under the language prefix, because that is where
    # it has always lived for the existing clients. The app asks for it without
    # one, so put the prefix back — on this host only, leaving the other domain
    # untouched.
    # `^~` so this wins over the regex above, which would otherwise match first.
    location ^~ /o/ {
        rewrite ^/o/(.*)$ /de/o/$1 break;
        uwsgi_pass uwsgi;
        include /etc/nginx/uwsgi_params;
    }

    location /protected {
        internal;
        alias /var/www/jdav_web/media;
    }

    # Django's own static files, needed by the pages it still renders on this
    # origin — the OAuth login form among them.
    location /static {
        alias /var/www/jdav_web/static;
    }

    location /downtime {
        alias /var/www/jdav_web/static/downtime;
    }

    # --- the SPA itself ---------------------------------------------------

    # The bundle is ~1 MB uncompressed and ~300 kB gzipped; the inherited
    # nginx.conf leaves gzip off, which is fine for Django's small HTML but not
    # for this.
    gzip on;
    gzip_types application/javascript text/css image/svg+xml application/json;
    gzip_min_length 1024;

    # Vite writes content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a client-side route: hand back index.html and let the
    # router resolve it. index.html itself must never be cached, or a browser
    # keeps loading an old build's asset URLs after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
